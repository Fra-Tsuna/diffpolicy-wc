_target_: src.trainer.trainer.TrainingPipeline
_recursive_: false
_convert_: all
iterations: 10000
result_dir: ${result_dir}
validate_every: 500
checkpoint_every: 500
patience: null
grad_clip_norm: 1.0
use_ema: false
ema:
  update_after_step: 0
  use_ema_warmup: false
  min_decay: 0.0
  decay: 0.9999
  inv_gamma: 1.0
  power: 0.75
# Closed-loop episodes in the experiment's simulator at every validation, e.g.
# {n_episodes: 20, seed: 1000, max_steps: null (env time limit), save_videos: true}; null disables them.
rollout: null
# Selection metric of best.pth (and of patience): loss (validation, lower is better) or success_rate (rollouts).
best_metric: loss
# model, dataloaders, optimizer, lr_scheduler, accelerator, run_config are supplied at runtime.
