# @package _global_
# Diffusion Policy on ALOHA Transfer Cube: 50 human demonstrations at 50 Hz, 14-D joint states and actions,
# one 480x640 top camera. Run with: python main.py experiment=aloha_transfer_cube
# The main hyperparameters are restated here, even where they equal the group defaults, so this file
# shows the whole experiment. Rollout settings (n_episodes, max_steps, ...) stay in rollout.yaml, which
# is applied after the experiment.

defaults:
  - override /model: default
  - override /optimizer: adamw
  - override /lr_scheduler: cosine
  - override /env: aloha_transfer_cube

name: diffusion_aloha_transfer_cube
seed: 42
repo_id: lerobot/aloha_sim_transfer_cube_human
# No pretrained ALOHA Diffusion Policy: rollout.py needs checkpoint_path (or an explicit pretrained_path).
pretrained_path: null

model:
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  num_train_timesteps: 100
  num_inference_steps: 20
  down_dims: [128, 256, 512]
  pretrained_backbone_weights: null
  use_group_norm: true
  resize_shape: [192, 256]
  crop_ratio: 1.0
  crop_shape: null
  crop_is_random: true

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-2

lr_scheduler:
  num_warmup_steps: 500

trainer:
  iterations: 10000
  validate_every: 5000
  checkpoint_every: 5000
  patience: null
  grad_clip_norm: 1.0
  use_ema: true
  ema:
    decay: 0.999
    power: 0.75

  rollout:
    n_episodes: 20
    seed: 1000
    max_steps: null
    save_videos: true
  best_metric: success_rate

accelerator:
  mixed_precision: "no"

train_dataloader:
  batch_size: 64
  num_workers: 0
  dataset:
    image_transforms:
      _target_: lerobot.transforms.ImageTransforms
      cfg:
        _target_: lerobot.transforms.ImageTransformsConfig
        enable: true
        max_num_transforms: 2
        random_order: false
        tfs:
          brightness:
            _target_: lerobot.transforms.ImageTransformConfig
            type: ColorJitter
            kwargs:
              brightness: [0.9, 1.1]
          contrast:
            _target_: lerobot.transforms.ImageTransformConfig
            type: ColorJitter
            kwargs:
              contrast: [0.9, 1.1]
          saturation:
            _target_: lerobot.transforms.ImageTransformConfig
            type: ColorJitter
            kwargs:
              saturation: [0.9, 1.1]
val_dataloader:
  batch_size: 64
  num_workers: ${train_dataloader.num_workers}
