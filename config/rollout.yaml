defaults:
  - train
  - _self_

# Policy source: checkpoint_path (a best.pth trained here) takes precedence over pretrained_path (a LeRobot policy directory).
# Create the default pretrained_path with scripts/download_pretrained.sh (Hub lerobot/diffusion_pusht, converted for lerobot 0.6).
pretrained_path: ${ckpt_root}/diffusion_pusht
checkpoint_path: null
apply_ema: false
n_episodes: 3
max_steps: 300
video_dir: ${result_dir}/videos
# Draw the denoising of each action chunk, then the plan being executed, on the videos.
diffusion_overlay: true
denoising_frames: 5

hydra:
  run:
    dir: ${original_work_dir}/outputs/${name}/rollout/${now:%Y-%m-%d}/${now:%H-%M-%S}
