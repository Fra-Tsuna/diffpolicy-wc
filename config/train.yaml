defaults:
  - _self_
  - accelerator: default
  - model: default
  - optimizer: adamw
  - lr_scheduler: cosine
  - dataloader@train_dataloader: train
  - dataloader@val_dataloader: val
  - trainer: default
  - wandb: default
  # Simulator for rollout.py; part of the experiment, unused by training.
  - env: pusht
  - experiment: null
  - override hydra/hydra_logging: colorlog
  - override hydra/job_logging: colorlog

name: diffusion_pusht
seed: 42
# LeRobot dataset of the train, val and test splits.
repo_id: lerobot/pusht
# Policy that rollout.py runs when no checkpoint_path is given; unused by training.
# Create it with scripts/download_pretrained.sh (Hub lerobot/diffusion_pusht, converted for lerobot 0.6).
pretrained_path: ${ckpt_root}/diffusion_pusht
original_work_dir: ${hydra:runtime.cwd}
data_root: ${original_work_dir}/data
ckpt_root: ${original_work_dir}/ckpt
result_dir: ${hydra:runtime.output_dir}
resume_from: null

hydra:
  job:
    chdir: false
  # colorlog writes the log relative to the working directory; keep it in the run directory.
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
  run:
    dir: ${original_work_dir}/outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${original_work_dir}/multirun/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
